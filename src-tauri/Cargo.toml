[package]
name = "explorer-x"
version = "0.1.0"
description = "Cross-platform file explorer modeled on Windows Explorer"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "explorer_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
arboard = "3"
file_icon_provider = "1"
png = "0.18"
base64 = "0.22"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
sha2 = "0.10"

# Release: thin LTO + parallel codegen builds ~40% faster than full LTO (92s vs 152s clean in
# our measurements) for an executable about 15% larger. Set CARGO_PROFILE_RELEASE_LTO=true and
# CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 for the smallest possible binary.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

# Dev: line tables are enough for backtraces and make linking faster.
[profile.dev]
debug = "line-tables-only"
