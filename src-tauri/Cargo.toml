[package]
name = "explorer-x"
version = "0.1.0"
description = "Cross-platform file explorer modeled on Windows Explorer"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "explorer_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
arboard = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
