<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Explorer X</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="toolbar" data-tauri-drag-region>
  <button id="back" title="Back (Alt+Left)">&#8592;</button>
  <button id="fwd" title="Forward (Alt+Right)">&#8594;</button>
  <button id="up" title="Up (Alt+Up)">&#8593;</button>
  <button id="refresh" title="Refresh (F5)">&#8635;</button>
  <div id="addressWrap"><div id="crumbs"></div><input id="address" spellcheck="false" hidden></div>
  <input id="search" placeholder="Search this folder" spellcheck="false">
  <button id="saveSearch" title="Save this search to the sidebar" hidden>&#9734; Save</button>
</header>
<div id="tabs"></div>
<nav id="commandbar">
  <button id="undo" title="Undo" disabled>&#8630; Undo</button>
  <button id="redo" title="Redo" disabled>&#8631; Redo</button>
  <button id="newFolder">New folder</button>
  <button id="cut">Cut</button>
  <button id="copy">Copy</button>
  <button id="paste">Paste</button>
  <button id="renameBtn">Rename</button>
  <button id="delete">Delete</button>
  <span class="spacer"></span>
  <button id="filterBtn" title="Filter by type, size or date">Filter</button>
  <select id="sort">
    <option value="name">Sort: Name</option><option value="mtime">Sort: Date modified</option>
    <option value="ext">Sort: Type</option><option value="size">Sort: Size</option>
  </select>
  <input id="zoom" type="range" min="32" max="128" value="64" title="Icon size (Ctrl+scroll)">
  <button id="splitBtn" title="Split view (Ctrl+\)">Split</button>
  <button id="previewBtn" title="Preview pane (Alt+P)">Preview</button>
  <button id="hidden"title="Show hidden items (Ctrl+H)">Hidden</button>
  <button id="view" title="Toggle view">View: Details</button>
  <button id="moreBtn" title="Keyboard shortcuts and more">More &#9662;</button>
</nav>
<div id="filterbar" hidden>
  <label>Type
    <select id="fType">
      <option value="all">All</option><option value="folders">Folders</option><option value="images">Images</option>
      <option value="video">Video</option><option value="audio">Audio</option><option value="documents">Documents</option>
      <option value="archives">Archives</option><option value="code">Code</option><option value="programs">Programs</option>
    </select>
  </label>
  <label>Size (files)
    <select id="fSize">
      <option value="any">Any</option><option value="empty">Empty</option><option value="small">Under 1 MB</option>
      <option value="medium">1 MB to 100 MB</option><option value="large">100 MB to 1 GB</option><option value="huge">Over 1 GB</option>
    </select>
  </label>
  <label>Modified
    <select id="fDate">
      <option value="any">Any time</option><option value="today">Today</option><option value="week">Last 7 days</option>
      <option value="month">Last 30 days</option><option value="year">This year</option><option value="older">Over a year ago</option>
    </select>
  </label>
  <button id="fClear">Clear</button>
</div>
<main>
  <aside id="nav" tabindex="0"></aside>
  <div id="resizer" title="Drag to resize (double-click to reset)"></div>
  <section id="files" tabindex="0"></section>
  <section id="pane2" hidden>
    <div class="p2bar">
      <button id="p2up" title="Up">&#8593;</button>
      <input id="p2addr" spellcheck="false" title="Folder shown in the second pane">
      <button id="p2close" title="Close split view (Ctrl+\)">&times;</button>
    </div>
    <div id="p2list" tabindex="0"></div>
  </section>
  <aside id="preview" hidden></aside>
</main>
<footer id="status"><span id="count"></span><span id="selinfo"></span><span id="space"></span></footer>
<div id="menu" hidden></div>
<div id="modal" hidden></div>
<script src="bridge.js"></script>
<script type="module" src="renderer.js"></script>
</body>
</html>
